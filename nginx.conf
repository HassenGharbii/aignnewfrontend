server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The bundle calls the API on its own origin, so it works from whatever
    # host the dashboard is opened on; forward those calls to the api service.
    location ~ ^/(api|people)/ {
        proxy_pass http://api:9911;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
