# Postgres only, for running api/worker natively against a containerized DB:
#   docker compose -f docker-compose.db.yml up -d
# Pair it with a .env whose DATABASE_URL points at localhost:5432.
# For the whole stack in containers, use docker-compose.yml instead.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: morour
      POSTGRES_USER: morour
      POSTGRES_PASSWORD: morour
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morour"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
