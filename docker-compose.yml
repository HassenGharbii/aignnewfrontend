services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: morour
      POSTGRES_USER: morour
      POSTGRES_PASSWORD: morour
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morour"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
