# Full stack: `docker compose up --build` starts everything.
# Need just Postgres (running api/worker natively)? Use docker-compose.db.yml.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: morour
      POSTGRES_USER: morour
      POSTGRES_PASSWORD: morour
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morour"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Forwards to the source events API. The api/worker containers can't dial
  # API_BASE_URL's 172.19.0.37 directly — that address sits inside Docker's own
  # default bridge pool (172.17-172.31), so a container would resolve it to a
  # peer on its own network. This stack's network is pinned to 10.201.0.0/24
  # (see `networks` below) to keep that route clear.
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    environment:
      LISTEN_PORT: "8004"
      TARGET_HOST: ${PROXY_TARGET_HOST:-172.19.0.37}
      TARGET_PORT: ${PROXY_TARGET_PORT:-8003}
    ports:
      # Published for debugging from the host; api/worker reach it as proxy:8004.
      - "8004:8004"
    healthcheck:
      # Liveness only — confirms the forwarder is accepting connections. Target
      # reachability is deliberately not checked here, so the stack still comes
      # up in USE_SAMPLE_DATA mode when the source API is unreachable.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8004), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://morour:morour@db:5432/morour
      # .env points these at the host for the native-run workflow; inside a
      # container "localhost" means the container itself, so override both.
      API_BASE_URL: http://proxy:8004
      OLLAMA_HOST: http://host.docker.internal:11434
    ports:
      - "9911:9911"
    depends_on:
      db:
        condition: service_healthy
      proxy:
        condition: service_healthy
    # Lets the container reach Ollama running on the host machine's GPU (Linux
    # needs this mapping; Docker Desktop on Windows/Mac provides it by default).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://morour:morour@db:5432/morour
      API_BASE_URL: http://proxy:8004
      OLLAMA_HOST: http://host.docker.internal:11434
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
      proxy:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:9911}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db_data:

networks:
  default:
    ipam:
      config:
        # Keeps this stack off 172.16.0.0/12 so containers route the source
        # API's 172.19.x address out to the host instead of onto their own
        # bridge. Change this if 10.201.x collides with your own network.
        - subnet: 10.201.0.0/24
