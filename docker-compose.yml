# Full stack: `docker compose up --build` starts everything.
# Need just Postgres (running api/worker natively)? Use docker-compose.db.yml.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: morour
      POSTGRES_USER: morour
      POSTGRES_PASSWORD: morour
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morour"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Forwards to the source events API. The api/worker containers can't dial
  # API_BASE_URL's 172.19.0.37 directly — that address sits inside Docker's own
  # default bridge pool (172.17-172.31), so a container would resolve it to a
  # peer on its own network. This stack's network is pinned to 10.201.0.0/24
  # (see `networks` below) to keep that route clear.
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    environment:
      LISTEN_PORT: "8004"
      TARGET_HOST: ${PROXY_TARGET_HOST:-172.19.0.37}
      TARGET_PORT: ${PROXY_TARGET_PORT:-8003}
    ports:
      # Published for debugging from the host; api/worker reach it as proxy:8004.
      - "8004:8004"
    healthcheck:
      # Liveness only — confirms the forwarder is accepting connections. Target
      # reachability is deliberately not checked here, so the stack still comes
      # up in USE_SAMPLE_DATA mode when the source API is unreachable.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8004), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Inference server. Unlike Ollama (which this replaced) vLLM has no native
  # Windows build, so it runs here rather than on the host, and it keeps the
  # model resident for the process lifetime instead of evicting it.
  vllm:
    image: vllm/vllm-openai:latest
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen3-8B-AWQ}"
      # A fraction of TOTAL VRAM, not an absolute: 0.85 of 16311MiB (RTX 5060 Ti)
      # is ~13.9GB, which holds the AWQ weights (~5.7GB) plus KV cache and leaves
      # headroom for the desktop. Recalculate this if you change the card or model.
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_FRACTION:-0.85}"
      # Event texts are short; capping context leaves more of the budget as KV
      # cache instead of reserving it for a window nothing here uses.
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-8192}"
      # classify and extract for one event share a prompt prefix on purpose
      # (see pipeline.classify_subcategory), so caching it skips a second prefill.
      - "--enable-prefix-caching"
    environment:
      # Only needed for gated repos; harmless when unset.
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      # Without this the weights re-download on every container recreate.
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    # vLLM uses shared memory for its worker IPC; the default 64MB is too small.
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      # Loading an 8B takes minutes, and longer still on a cold HuggingFace
      # cache. Failures before this elapses don't count against `retries`.
      start_period: 1800s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Runs once and exits. /health goes green when weights are loaded, but the
  # first schema-guided request still pays for grammar compilation — this pays
  # it up front so the worker's first real event doesn't.
  warmup:
    build: .
    env_file: .env
    environment:
      VLLM_HOST: http://vllm:8000
      CLASSIFICATION_MODEL: ${VLLM_MODEL:-Qwen/Qwen3-8B-AWQ}
      EXTRACTION_MODEL: ${VLLM_MODEL:-Qwen/Qwen3-8B-AWQ}
    command: ["python", "-m", "app.warmup"]
    restart: "no"
    depends_on:
      vllm:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://morour:morour@db:5432/morour
      # .env points these at the host for the native-run workflow; inside a
      # container "localhost" means the container itself, so override them.
      API_BASE_URL: http://proxy:8004
      VLLM_HOST: http://vllm:8000
      CLASSIFICATION_MODEL: ${VLLM_MODEL:-Qwen/Qwen3-8B-AWQ}
      EXTRACTION_MODEL: ${VLLM_MODEL:-Qwen/Qwen3-8B-AWQ}
    ports:
      - "9911:9911"
    # Deliberately NOT gated on warmup: every endpoint the dashboard uses reads
    # from Postgres, and only /events/poll touches the model (through a lazy
    # import). Waiting for weights to load would take the dashboard offline for
    # minutes on every start for no benefit; an early /events/poll just errors.
    depends_on:
      db:
        condition: service_healthy
      proxy:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://morour:morour@db:5432/morour
      API_BASE_URL: http://proxy:8004
      VLLM_HOST: http://vllm:8000
      CLASSIFICATION_MODEL: ${VLLM_MODEL:-Qwen/Qwen3-8B-AWQ}
      EXTRACTION_MODEL: ${VLLM_MODEL:-Qwen/Qwen3-8B-AWQ}
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
      proxy:
        condition: service_healthy
      warmup:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:9911}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db_data:
  hf_cache:

networks:
  default:
    ipam:
      config:
        # Keeps this stack off 172.16.0.0/12 so containers route the source
        # API's 172.19.x address out to the host instead of onto their own
        # bridge. Change this if 10.201.x collides with your own network.
        - subnet: 10.201.0.0/24
