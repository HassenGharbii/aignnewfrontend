services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: morour
      POSTGRES_USER: morour
      POSTGRES_PASSWORD: morour
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morour"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://morour:morour@db:5432/morour
    ports:
      - "9911:9911"
    depends_on:
      db:
        condition: service_healthy
    # Lets the container reach Ollama running on the host machine's GPU (Linux
    # needs this mapping; Docker Desktop on Windows/Mac provides it by default).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://morour:morour@db:5432/morour
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:9911}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db_data:
